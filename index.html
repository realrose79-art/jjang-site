<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 기록장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scenery up" aria-hidden="true"></div>
  <div class="scenery down" aria-hidden="true"></div>
  <header class="top">
    <h1>나의 기록장</h1>
    <p class="sub" id="heroLine"></p>
  </header>

  <div class="backup-bar login-bar" id="loginBar" role="status" hidden>
    <span>🔒 지금은 <b>조회만</b> 가능해요. 기록 입력·수정·삭제와 AI 추천 대화는 로그인해야 해요.</span>
    <button class="btn small primary" data-act="auth">로그인</button>
  </div>
  <div class="backup-bar" id="backupBar" role="status" hidden></div>

  <nav class="nav" id="nav">
    <button data-tab="exercise" class="on"><span class="ico">🚴</span><span>나의 운동</span></button>
    <button data-tab="music"><span class="ico">🎹</span><span>나의 음악</span></button>
    <button data-tab="travel"><span class="ico">🧳</span><span>나의 여행</span><span class="ai-badge" aria-label="AI 추천 있음">AI</span></button>
  </nav>

  <main>
    <div class="sheet">
      <section id="view-exercise" class="view on"></section>

      <section id="view-music" class="view"></section>

      <section id="view-travel" class="view">
        <div id="travelTop"></div>
        <div id="map" class="map"></div>
        <div id="travelList"></div>
      </section>
    </div>

    <footer class="foot">
      <button class="btn ghost small" data-act="export">백업 저장</button>
      <button class="btn ghost small" data-act="import">백업 불러오기</button>
      <button class="btn ghost small" id="authBtn" data-act="auth">로그인</button>
      <button class="btn ghost small" data-act="sync">지금 동기화</button>
      <button class="btn ghost small" data-act="clearSamples">예시 데이터 지우기</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="note">조회는 로그인 없이 되고, 입력·수정·삭제는 로그인해야 해요. 로그인하면 기록이 서버에 저장돼 다른 기기에서도 보여요. 가끔 백업 저장으로 파일을 남겨 두세요.</p>
      <p class="note" id="syncNote"></p>
      <p class="note" id="backupNote"></p>
    </footer>
  </main>

  <dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
  <div id="toast" class="toast" popover="manual"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="ai-plans.js"></script>
  <script src="app.js"></script>
</body>
</html>
